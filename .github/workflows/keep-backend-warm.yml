name: Keep Backend Warm

# ─────────────────────────────────────────────────────────────────────────────
# Manually pings the Render backend /health endpoint when needed.
# Production warm-up is handled by cron-job.org to preserve Render's
# 750-hour monthly free-tier budget.
#
# Use GitHub Actions → Keep Backend Warm → Run workflow for an on-demand
# wake-up or health check. BACKEND_URL may be configured as a repository
# secret; the fallback URL is used when it is not set.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging backend at $BACKEND_URL/health ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            "$BACKEND_URL/health")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: health check returned $STATUS (backend may be cold-starting)"
          fi
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://isa-backend-bpbt.onrender.com' }}
