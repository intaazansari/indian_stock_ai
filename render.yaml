# render.yaml — Render.com Infrastructure as Code
#
# This file defines the backend-only services for the Indian Stock AI platform.
# Commit this file and Render will detect and provision everything automatically.
#
# Render services:
#   isa-backend       → FastAPI  (Web Service, Docker)
#   isa-celery-worker → Celery   (Background Worker, Docker)
#   isa-redis         → Redis    (Managed)
#   Neon PostgreSQL   → external database configured via DATABASE_URL
#
# The frontend is NOT deployed via Render. It is deployed on Vercel
# (native `next build`, no Docker) — see README.md and docs/SDD.md §7.
# `infrastructure/docker/frontend.Dockerfile` is kept only for local
# `docker-compose` development, not for Render deployment.
#
# Qdrant: Render has no managed Qdrant.
#   Option A (recommended): Qdrant Cloud free tier → https://cloud.qdrant.io
#   Option B: Skip for now — Qdrant is only needed for PDF/RAG features.
#             Set QDRANT_URL="" to disable gracefully.
#
# Deploy steps — see README for full walkthrough:
#   1. Push this repo to GitHub
#   2. Go to render.com → New → Blueprint
#   3. Connect your GitHub repo
#   4. Set the secret env vars marked with sync: false in the Render dashboard

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: isa-backend
    runtime: docker
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerContext: ./backend
    plan: free                          # upgrade to starter ($7/mo) for always-on
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # ── App settings ──────────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "ValuePilotage"

      # ── Security (auto-generated by Render) ───────────────────────────────
      - key: SECRET_KEY
        generateValue: true             # Render generates a secure random value

      # ── Database — Neon connection string set in the Render dashboard ─────
      - key: DATABASE_URL
        sync: false                     # paste the Neon connection string

      # ── Redis — injected from managed Redis below ─────────────────────────
      - key: REDIS_URL
        fromService:
          type: redis
          name: isa-redis
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: isa-redis
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: isa-redis
          property: connectionString

      # ── AI (Groq) — SET THESE IN RENDER DASHBOARD ─────────────────────────
      - key: OPENAI_API_KEY
        sync: false                     # paste your gsk_... key in the dashboard
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_ANALYSIS_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_SUMMARY_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small

      # ── CORS / Hosts — SET IN DASHBOARD after frontend URL is known ────────
      # Frontend origin is the Vercel production domain (valuepilotage.com),
      # not a Render URL — the frontend is not deployed on Render.
      - key: CORS_ORIGINS
        value: '["https://valuepilotage.com","https://www.valuepilotage.com","http://localhost:3000"]'
      # Example: ALLOWED_HOSTS=["isa-backend.onrender.com"]
      - key: ALLOWED_HOSTS
        value: '["isa-backend-bpbt.onrender.com","localhost","127.0.0.1"]'

      # ── Qdrant (optional — skip for Phase 1) ─────────────────────────────
      # Leave blank/missing to disable. Set to Qdrant Cloud URL to enable.
      - key: QDRANT_URL
        value: ""                       # empty = Qdrant disabled (safe to leave)
      - key: QDRANT_API_KEY
        sync: false                     # set if using Qdrant Cloud

  # ── Celery Worker ────────────────────────────────────────────────────────────
  - type: worker
    name: isa-celery-worker
    runtime: docker
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerContext: ./backend
    dockerCommand: ./celery-entrypoint.sh
    plan: free
    autoDeploy: true

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: isa-backend
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        sync: false                     # same Neon connection string as backend
      - key: REDIS_URL
        fromService:
          type: redis
          name: isa-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: isa-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: isa-redis
          property: connectionString
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: isa-backend
          envVarKey: OPENAI_API_KEY
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_ANALYSIS_MODEL
        value: openai/gpt-oss-120b
      - key: QDRANT_URL
        value: ""

  # ── Redis ────────────────────────────────────────────────────────────────────
  - type: redis
    name: isa-redis
    plan: free                          # 25 MB RAM — fine for dev/staging
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []                     # empty = no external access; internal Render services connect via private URL

# Production PostgreSQL is hosted by Neon and configured through DATABASE_URL
# on the backend and worker services above. No Render database is provisioned.
