# render.yaml — Render.com Infrastructure as Code
#
# This file defines ALL services for the Indian Stock AI platform.
# Commit this file and Render will detect and provision everything automatically.
#
# Render services:
#   isa-backend       → FastAPI  (Web Service, Docker)
#   isa-celery-worker → Celery   (Background Worker, Docker)
#   isa-frontend      → Next.js  (Web Service, Docker)
#   isa-redis         → Redis    (Managed)
#   isa-postgres      → PostgreSQL (Managed Database)
#
# Qdrant: Render has no managed Qdrant.
#   Option A (recommended): Qdrant Cloud free tier → https://cloud.qdrant.io
#   Option B: Skip for now — Qdrant is only needed for PDF/RAG features.
#             Set QDRANT_URL="" to disable gracefully.
#
# Deploy steps — see README for full walkthrough:
#   1. Push this repo to GitHub
#   2. Go to render.com → New → Blueprint
#   3. Connect your GitHub repo
#   4. Set the secret env vars marked with sync: false in the Render dashboard

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: isa-backend
    runtime: docker
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerContext: ./backend
    plan: free                          # upgrade to starter ($7/mo) for always-on
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # ── App settings ──────────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "StockSage AI"

      # ── Security (auto-generated by Render) ───────────────────────────────
      - key: SECRET_KEY
        generateValue: true             # Render generates a secure random value

      # ── Database — injected from managed Postgres below ───────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: isa-postgres
          property: connectionString    # Render provides postgresql:// format
                                        # config.py auto-converts to asyncpg://

      # ── Redis — injected from managed Redis below ─────────────────────────
      - key: REDIS_URL
        fromService:
          type: redis
          name: isa-redis
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: isa-redis
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: isa-redis
          property: connectionString

      # ── AI (Groq) — SET THESE IN RENDER DASHBOARD ─────────────────────────
      - key: OPENAI_API_KEY
        sync: false                     # paste your gsk_... key in the dashboard
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_ANALYSIS_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_SUMMARY_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small

      # ── CORS / Hosts — SET IN DASHBOARD after frontend URL is known ────────
      # Example: CORS_ORIGINS=["https://isa-frontend.onrender.com"]
      - key: CORS_ORIGINS
        value: '["https://isa-frontend-otyp.onrender.com","http://localhost:3000"]'
      # Example: ALLOWED_HOSTS=["isa-backend.onrender.com"]
      - key: ALLOWED_HOSTS
        value: '["isa-backend-bpbt.onrender.com","localhost","127.0.0.1"]'

      # ── Qdrant (optional — skip for Phase 1) ─────────────────────────────
      # Leave blank/missing to disable. Set to Qdrant Cloud URL to enable.
      - key: QDRANT_URL
        value: ""                       # empty = Qdrant disabled (safe to leave)
      - key: QDRANT_API_KEY
        sync: false                     # set if using Qdrant Cloud

  # ── Celery Worker ────────────────────────────────────────────────────────────
  - type: worker
    name: isa-celery-worker
    runtime: docker
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerContext: ./backend
    dockerCommand: ./celery-entrypoint.sh
    plan: free
    autoDeploy: true

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: isa-backend
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: isa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: isa-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: isa-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: isa-redis
          property: connectionString
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: isa-backend
          envVarKey: OPENAI_API_KEY
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_ANALYSIS_MODEL
        value: openai/gpt-oss-120b
      - key: QDRANT_URL
        value: ""

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  - type: web
    name: isa-frontend
    runtime: docker
    dockerfilePath: ./infrastructure/docker/frontend.Dockerfile
    dockerContext: ./frontend
    plan: free
    autoDeploy: true

    envVars:
      # NEXT_PUBLIC_API_URL must be the full backend URL
      # After first deploy, update this to: https://isa-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://isa-backend-bpbt.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: "StockSage AI"

  # ── Redis ────────────────────────────────────────────────────────────────────
  - type: redis
    name: isa-redis
    plan: free                          # 25 MB RAM — fine for dev/staging
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []                     # empty = no external access; internal Render services connect via private URL

databases:
  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  - name: isa-postgres
    databaseName: isa_db
    user: isa_user
    plan: free                          # 256 MB RAM, 1 GB storage, expires 90 days
                                        # upgrade to starter ($7/mo) for persistence
