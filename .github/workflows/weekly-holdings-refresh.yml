name: Weekly Holdings Refresh

# ─────────────────────────────────────────────────────────────────────────────
# Runs every Sunday at 23:30 IST (18:00 UTC).
# Updates: promoter %, FII %, DII %, public % for all fully-seeded companies.
# Source:  Screener.in (with BSE code fallback for companies like LTIM/TATAMOTORS).
# Only refreshes companies that already have key_ratios (the ~50 Nifty companies).
# Use --all flag (workflow_dispatch input) to refresh all 500+ companies (~30 min).
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 18 * * 0"    # Sunday  18:00 UTC  =  23:30 IST
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated NSE symbols (blank = all seeded)"
        required: false
        default: ""
      all_companies:
        description: "Refresh all 500+ companies (slow, ~30 min)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (no DB writes)"
        type: boolean
        default: false

jobs:
  refresh-holdings:
    name: Refresh holdings
    runs-on: ubuntu-latest
    timeout-minutes: 60   # Screener.in rate-limits; allow extra time

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh_holdings
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            ARGS="--symbols ${{ github.event.inputs.symbols }}"
          elif [ "${{ github.event.inputs.all_companies }}" = "true" ]; then
            ARGS="--all"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m scripts.refresh_holdings --verbose $ARGS
