name: Quarterly Financials Refresh

# ─────────────────────────────────────────────────────────────────────────────
# Updates P&L, Balance Sheet, Cash Flow statements and Key Ratios for all
# Nifty 50 companies after quarterly results season.
#
# Indian results calendar (approximate):
#   Q1 (Apr–Jun)  → published by mid-August    → trigger ~Aug 15
#   Q2 (Jul–Sep)  → published by mid-November  → trigger ~Nov 15
#   Q3 (Oct–Dec)  → published by mid-February  → trigger ~Feb 15
#   Q4 (Jan–Mar)  → published by mid-May       → trigger ~May 15
#
# Primary trigger: workflow_dispatch (manual) — run after results are out.
# Fallback cron:   15th of Aug / Nov / Feb / May at 02:00 UTC.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated NSE symbols (blank = full Nifty 50)"
        required: false
        default: ""
      years:
        description: "Years of history to fetch (default 5)"
        required: false
        default: "5"
      no_screener:
        description: "Skip Screener.in (faster, no promoter data update)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (no DB writes)"
        type: boolean
        default: false
  schedule:
    # ~2 weeks after each Indian results season ends
    - cron: "0 2 15 8,11,2,5 *"   # Aug 15, Nov 15, Feb 15, May 15  at 02:00 UTC

jobs:
  refresh-financials:
    name: Refresh financials
    runs-on: ubuntu-latest
    timeout-minutes: 120   # Full Nifty 50 seed with Screener takes ~15–30 min

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run seed_db (upserts — safe to re-run)
        run: |
          ARGS="--years ${{ github.event.inputs.years || '5' }}"
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            ARGS="$ARGS --symbols ${{ github.event.inputs.symbols }}"
          fi
          if [ "${{ github.event.inputs.no_screener }}" = "true" ]; then
            ARGS="$ARGS --no-screener"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m scripts.seed_db $ARGS

      - name: Summary
        if: always()
        run: echo "Quarterly financials refresh completed. Check logs above for per-company status."
